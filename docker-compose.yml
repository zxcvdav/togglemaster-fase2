name: togglemaster

services:

  # ------------------------------------------------------------------
  # Bancos de dados locais (4, conforme especificado)
  # ------------------------------------------------------------------

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
      - ./db-init/postgres-auth:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432" # host:container -- só para inspeção manual (psql do host)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Instância compartilhada por flag-service e targeting-service (ver nota no
  # README-DEVOPS.md: a tarefa pede 2 instâncias Postgres para 3 consumidores).
  postgres-flags:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flags_db
    volumes:
      - pgdata-flags:/var/lib/postgresql/data
      - ./db-init/postgres-flags:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flags_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    container_name: togglemaster-dynamodb-local-1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "[ -d /tmp ] || exit 1"] # ou teste de porta via nc/bash
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    environment:
      PORT: "8001"
      DATABASE_URL: "postgres://postgres:postgres@postgres-auth:5432/auth_db?sslmode=disable"
      MASTER_KEY: "${MASTER_KEY:-admin-secreto-123}"
    depends_on:
      postgres-auth:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  flag-service:
    build:
      context: ./flag-service
      dockerfile: Dockerfile
    environment:
      PORT: "8002"
      DATABASE_URL: "postgres://postgres:postgres@postgres-flags:5432/flags_db?sslmode=disable"
      AUTH_SERVICE_URL: "http://auth-service:8001"
    depends_on:
      postgres-flags:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  targeting-service:
    build:
      context: ./targeting-service
      dockerfile: Dockerfile
    environment:
      PORT: "8003"
      DATABASE_URL: "postgres://postgres:postgres@postgres-flags:5432/targeting_db?sslmode=disable"
      AUTH_SERVICE_URL: "http://auth-service:8001"
    depends_on:
      postgres-flags:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8003/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  evaluation-service:
    build:
      context: ./evaluation-service
      dockerfile: Dockerfile
    environment:
      PORT: "8004"
      REDIS_URL: "redis://redis:6379"
      FLAG_SERVICE_URL: "http://flag-service:8002"
      TARGETING_SERVICE_URL: "http://targeting-service:8003"
      # Precisa ser uma API key real, criada via POST /admin/keys no
      # auth-service DEPOIS da subida (ver README-DEVOPS.md, passo a passo).
      # Nao uso ${VAR:?erro} aqui de proposito: isso quebraria `docker compose up`
      # para QUALQUER subconjunto de servicos, porque o compose interpola o
      # arquivo inteiro antes de decidir o que subir -- inviabilizaria o boot em
      # duas fases que este servico exige. Sem a chave, ele sobe mas responde
      # 502 nas avaliacoes (comportamento documentado, nao um crash silencioso).
      SERVICE_API_KEY: "${SERVICE_API_KEY:-}"
      # SQS permanece AWS real por design (os READMEs referenciam AWS Academy);
      # deixe em branco para rodar em modo degradado (loga localmente e nao envia).
      AWS_SQS_URL: "${AWS_SQS_URL:-}"
      AWS_REGION: "${AWS_REGION:-}"
    depends_on:
      redis:
        condition: service_healthy
      flag-service:
        condition: service_healthy
      targeting-service:
        condition: service_healthy
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8004/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    environment:
      PORT: "8005"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      # Real AWS por design (ver nota acima). Se nao definida, o container
      # sobe mas fica logando erro de conexao a cada ~10s no loop do worker --
      # isso e esperado sem uma fila real e nao impede validar o resto.
      AWS_SQS_URL: "${AWS_SQS_URL:-https://sqs.us-east-1.amazonaws.com/000000000000/placeholder}"
      AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
      # Aponta o client do DynamoDB para o container local (patch em app.py).
      AWS_DYNAMODB_ENDPOINT_URL: "http://dynamodb-local:8000"
      # DynamoDB Local nao valida credenciais, mas o boto3 exige que existam
      # para assinar a requisicao -- qualquer string serve aqui.
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-local}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-local}"
    depends_on:
      dynamodb-local:
        condition: service_healthy
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8005/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata-auth:
  pgdata-flags:
  dynamodb-data:
