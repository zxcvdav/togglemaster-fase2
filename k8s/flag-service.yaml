apiVersion: v1
kind: ConfigMap
metadata:
  name: flags-config
  namespace: flags
data:
  PORT: "8002"
  AUTH_SERVICE_URL: "http://auth-service.auth.svc.cluster.local:8001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: flags
  labels:
    app: flag-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          image: __ECR__/flag-service:v1
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: flags-config
            - secretRef:
                name: flags-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: flags
spec:
  type: ClusterIP
  selector:
    app: flag-service
  ports:
    - port: 8002
      targetPort: 8002
